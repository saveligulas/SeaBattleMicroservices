spring:
  application:
    name: gateway

  cloud:
    gateway:
      mvc:
        routes:
          - id: lobby-service
            uri: lb://lobby-service
            predicates:
              - Path=/api/v1/lobby/**
            filters:
              - StripPrefix=3
              - name: CircuitBreaker
                args:
                  name: lobbyServiceCircuitBreaker
                  fallbackUri: forward:/fallback

          - id: game-service
            uri: lb://game-service
            predicates:
              - Path=/api/v1/game/**
            filters:
              - name: CircuitBreaker
                args:
                  name: gameServiceCircuitBreaker
                  fallbackUri: forward:/fallback

          - id: auth-service
            uri: lb://auth-service
            predicates:
              - Path=/api/v1/auth/**
            filters:
              - StripPrefix=3
              - name: CircuitBreaker
                args:
                  name: authServiceCircuitBreaker
                  fallbackUri: forward:/fallback

  doc:
    api-docs:
      enabled: true
    swagger-ui:
      urls:
        - url: /proxied-api-docs/seabattle
          name: SeaBattle Service
        - url: /proxied-api-docs/lobby
          name: Lobby Service
        - url: /proxied-api-docs/auth
          name: Authorization Service

  resilience4j:
    circuitbreaker:
      instances:
        lobbyServiceCircuitBreaker:
          slidingWindowSize: 4
          failureRateThreshold: 50
          waitDurationInOpenState: 1000ms
          permittedNumberOfCallsInHalfOpenState: 2

        gameServiceCircuitBreaker:
          slidingWindowSize: 4
          failureRateThreshold: 50
          waitDurationInOpenState: 1000ms
          permittedNumberOfCallsInHalfOpenState: 2

        authServiceCircuitBreaker:
          slidingWindowSize: 4
          failureRateThreshold: 50
          waitDurationInOpenState: 1000ms
          permittedNumberOfCallsInHalfOpenState: 2

eureka:
  instance:
    instance-id: gateway
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/ # or your Eureka server

server:
  port: 9090

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.springframework.cloud.gateway.mvc: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.netflix: DEBUG
